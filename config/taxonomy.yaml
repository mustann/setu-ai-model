  - id: "other"
    name: "Other"
    aliases: ["General", "Administrative"]
    description: "Civic grievances not specifically covered by the primary categories, such as noise pollution, illegal hoardings, or administrative delays."
    problem_types:
      - name: "General Civic Grievance"
        keywords: ["noise", "loudspeaker", "encroachment", "illegal banner", "office", "certificate", "complaint", "delay"]
